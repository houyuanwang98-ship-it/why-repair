<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Why Repair · 数学证明审计演示</title>
  <style>
    :root{--ink:#132238;--muted:#64748b;--line:#dce5ef;--blue:#315efb;--pale:#f4f7fb;--bad:#b42318;--gap:#9a6700;--ok:#067647}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4ff,#f8fafc 48%,#eefbf7);color:var(--ink);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}.shell{max-width:1180px;margin:auto;padding:34px 22px 60px}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:24px}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.08em}.hero h1{font-size:34px;margin:5px 0}.hero p{max-width:690px;color:var(--muted);margin:0}.badge{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 35px #26456b12}.card h2{margin:0 0 15px;font-size:20px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button,.primary{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:650}.tabs button{background:var(--pale);color:var(--ink)}.tabs button.active,.primary{background:var(--blue);color:#fff}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}textarea,input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff}textarea{resize:vertical}.primary{width:100%;margin-top:15px}.primary:disabled{opacity:.55}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750}.valid_with_gap{color:var(--gap);background:#fff6d8}.invalid{color:var(--bad);background:#fee4e2}.undetermined{color:var(--muted);background:#eef2f6}.headline{display:flex;align-items:center;justify-content:space-between;gap:15px}.result-empty{color:var(--muted);padding:44px 8px;text-align:center}.metric{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--line);padding:12px 0}.metric span:first-child{color:var(--muted)}.repair{background:#edfdf7;border-left:4px solid var(--ok);padding:12px 14px;border-radius:8px;margin-top:12px}.nodes{margin-top:16px}.node{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}.node-id{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pale);font-weight:750}.node small{color:var(--muted)}.notice{font-size:13px;color:var(--muted);margin-top:14px}.error{color:var(--bad)}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{display:block}.badge{display:inline-block;margin-top:14px}}
  </style>
</head>
<body><main class="shell">
  <section class="hero"><div><div class="eyebrow">WHY REPAIR · LOCAL DEMO</div><h1>数学证明审计与最小修复</h1><p>将自然语言证明拆成依赖节点，定位第一个问题步骤，并区分“可以补桥的缺口”和“真正无效的推理”。</p></div><div class="badge">本地运行 · 无需 API Key</div></section>
  <section class="grid">
    <div class="card"><h2>输入证明</h2><div class="tabs" id="tabs"></div>
      <label>命题</label><textarea id="theorem" rows="3"></textarea>
      <label>假设（每行一条）</label><textarea id="assumptions" rows="3"></textarea>
      <label>证明步骤（每行一步）</label><textarea id="steps" rows="7"></textarea>
      <button class="primary" id="analyze">开始审计</button>
      <div class="notice">内置案例展示已完成 Codex 裁决的结果；编辑内容后运行的是确定性第一轮，并会如实标注待裁决项。</div>
    </div>
    <div class="card"><div class="headline"><h2>审计结果</h2><span id="status"></span></div><div id="result" class="result-empty">选择一个案例，然后点击“开始审计”。</div></div>
  </section>
</main><script>
let samples=[], selected=0, edited=false;
const $=id=>document.getElementById(id);
function fill(i){selected=i;edited=false;const s=samples[i];$('theorem').value=s.theorem;$('assumptions').value=s.assumptions.join('\n');$('steps').value=s.flawed_proof_steps.join('\n');renderTabs();render(s.verified_result,s.flawed_proof_steps,true)}
function renderTabs(){$('tabs').innerHTML=samples.map((s,i)=>`<button class="${i===selected?'active':''}" onclick="fill(${i})">案例 ${i+1}</button>`).join('')+'<button onclick="custom()">自定义</button>'}
function custom(){selected=-1;edited=true;$('theorem').value='';$('assumptions').value='';$('steps').value='';renderTabs();$('result').className='result-empty';$('result').textContent='输入命题与证明步骤后开始审计。';$('status').textContent=''}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(r,steps,verified=false){$('status').className='status '+r.status;$('status').textContent=r.status;let nodes=r.nodes||steps.map((claim,i)=>({node_id:i+1,claim,status:i+1===r.problem_step?r.problem_kind:'closed',depends_on:i?[i]:[]}));$('result').className='';$('result').innerHTML=`<div class="metric"><span>首个问题</span><b>第 ${r.problem_step??'—'} 步 · ${esc(r.problem_kind)}</b></div><div class="metric"><span>诊断</span><div>${esc(r.diagnosis)}</div></div>${r.repair?`<div class="repair"><b>最小修复</b><br>${esc(r.repair)}</div>`:''}<div class="nodes"><b>证明依赖节点</b>${nodes.map(n=>`<div class="node"><span class="node-id">${n.node_id}</span><div>${esc(n.claim)}<br><small>依赖：${n.depends_on?.length?n.depends_on.join(', '):'命题假设'}</small></div><small>${esc(n.status)}</small></div>`).join('')}</div>${verified?'<div class="notice">✓ 该结果来自 2026-08-23 已完成的端到端验证会话。</div>':`<div class="notice">确定性第一轮完成；待 Codex 裁决项：${r.pending_count??0}。</div>`}`}
async function analyze(){const button=$('analyze');if(selected>=0&&!edited){render(samples[selected].verified_result,samples[selected].flawed_proof_steps,true);return}button.disabled=true;button.textContent='正在运行检查器…';try{const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({theorem:$('theorem').value,assumptions:$('assumptions').value.split('\n'),steps:$('steps').value.split('\n')})});const data=await res.json();if(!res.ok)throw Error(data.error);render(data,$('steps').value.split('\n').filter(Boolean))}catch(e){$('result').innerHTML=`<div class="error">${esc(e.message)}</div>`}finally{button.disabled=false;button.textContent='开始审计'}}
$('analyze').onclick=analyze;['theorem','assumptions','steps'].forEach(id=>$(id).addEventListener('input',()=>edited=true));fetch('/api/samples').then(r=>r.json()).then(x=>{samples=x;fill(0)});
</script></body></html>
